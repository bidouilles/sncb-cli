[project]
name = "sncb-cli"
version = "0.1.0"
description = "Belgian train (SNCB/NMBS) times from the terminal, using the iRail API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.urls]
Homepage = "https://github.com/bidouilles/sncb-cli"

[project.scripts]
sncb = "sncb_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sncb_cli"]
